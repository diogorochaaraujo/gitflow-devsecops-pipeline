# Camada da aplicacao: o unico workflow de pipeline do repositorio.
# So gatilhos e permissoes; o fluxo (gitflow ou trunk) e escolhido no pipeline.yml.
# Num repositorio de fornecedor, este arquivo e protegido por regra de push
# (governance/rulesets/arquivos-plataforma.json): mudar a esteira e PR da plataforma.
name: Pipeline
run-name: ${{ github.event.pull_request && format('PR {0} {1}', github.event.pull_request.number, github.event.action) || format('push {0}', github.ref_name) }}

on:
  push:
    # branches de estado do GitOps e de PR de deploy nao sao codigo
    branches-ignore: [environments, "deploy/**"]
  pull_request:
    # edited: corrigir titulo/corpo (ex.: o chamado do changeRef) reavalia sem push vazio
    types: [opened, reopened, edited, synchronize, labeled, unlabeled, closed]

concurrency:
  # um push novo cancela a verificacao anterior da mesma branch/PR;
  # a main e o fechamento do PR (promocao) nunca sao cancelados
  group: pipeline-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'closed' || 'open' }}
  cancel-in-progress: ${{ github.event.action != 'closed' && github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: read
  checks: read
  id-token: write
  attestations: write

jobs:
  pipeline:
    name: Pipeline
    # plataforma pinada por SHA (docs/10-plataforma.md): a aplicacao escolhe quando
    # atualizar, o Dependabot propoe a versao nova depois da quarentena, e o
    # rollback da esteira e voltar este SHA. Numa organizacao, o repositorio da
    # plataforma e outro (<org>/pipeline-platform); aqui e este mesmo.
    uses: diogorochaaraujo/gitflow-devsecops-pipeline/.github/workflows/platform.yml@76e17043cc8c8f8390fd78c7b0565b2014b8604b # v1.0.0
