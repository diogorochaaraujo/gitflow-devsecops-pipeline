# Camada da plataforma: push em qualquer branch exceto main.
#
#   Prepare --+--> Security ---------------------+
#             +--> Build/Upload --> Container ---+--> Deploy (so branches de integracao) --> Report
#
# Toda branch ganha build e analise; so as de SnapshotBranches fazem deploy.
name: Pipeline Snapshot

on:
  workflow_call:
    inputs:
      platform-repository:
        description: Repositorio da plataforma (vazio = o proprio repositorio)
        type: string
        default: ''
      platform-ref:
        type: string
        default: ''

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prep.outputs.version }}
      name: ${{ steps.prep.outputs.name }}
      pipeline: ${{ steps.prep.outputs.pipeline }}
      security: ${{ steps.prep.outputs.security }}
      deploy-envs: ${{ steps.envs.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform-repository || github.repository }}
          ref: ${{ inputs.platform-ref || (inputs.platform-repository == '' && github.sha) || '' }}
          path: .platform
      - id: prep
        uses: ./.platform/.github/actions/prepare
        with:
          mode: snapshot
      - id: envs
        name: Deploy Targets
        env:
          PIPELINE: ${{ steps.prep.outputs.pipeline }}
          BRANCH: ${{ github.ref_name }}
        run: |
          branches=$(jq -r '.deploy.SnapshotBranches // ""' <<<"$PIPELINE" | tr -d ' ')
          envs=""
          if [[ ",$branches," == *",$BRANCH,"* ]]; then
            envs=$(jq -r '.deploy.SnapshotEnvs // ""' <<<"$PIPELINE")
          fi
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Branch $BRANCH -> deploy em: ${envs:-nenhum (so build e analise)}"

  security:
    name: Security
    needs: prepare
    uses: ./.github/workflows/pipeline-security.yml
    with:
      security: ${{ needs.prepare.outputs.security }}
      ref: ${{ github.sha }}
      skip-sast: ${{ fromJSON(needs.prepare.outputs.pipeline).env.SkipSastOnSnapshot == true }}
      skip-sca: ${{ fromJSON(needs.prepare.outputs.pipeline).env.SkipScaOnSnapshot == true }}

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/pipeline-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      name: ${{ needs.prepare.outputs.name }}
      pipeline: ${{ needs.prepare.outputs.pipeline }}
      security: ${{ needs.prepare.outputs.security }}
      ref: ${{ github.sha }}
      skip-container-scan: ${{ fromJSON(needs.prepare.outputs.pipeline).env.SkipContainerScanOnSnapshot == true }}

  # espera Security e Container: imagem com achado bloqueante nao chega nem ao DSV
  deploy:
    name: Environment Deploy
    needs: [prepare, security, build]
    if: needs.prepare.outputs.deploy-envs != ''
    uses: ./.github/workflows/pipeline-deploy.yml
    with:
      environments: ${{ needs.prepare.outputs.deploy-envs }}
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      platform-repository: ${{ inputs.platform-repository }}
      platform-ref: ${{ inputs.platform-ref }}

  report:
    name: Report
    needs: [prepare, security, build, deploy]
    if: always()
    uses: ./.github/workflows/pipeline-report.yml
    with:
      pipeline: Snapshot
      version: ${{ needs.prepare.outputs.version }}
      results: ${{ toJSON(needs) }}
