# Camada da plataforma: fecha toda execucao, passe ou falhe.
#   Audit          -> registro estruturado do que rodou, com qual versao e resultado
#   Error Analysis -> so em falha: junta as mensagens de erro dos jobs que quebraram
name: Pipeline Report

on:
  workflow_call:
    inputs:
      pipeline:
        type: string
        required: true
      version:
        type: string
        default: ''
      results:
        description: toJSON(needs) do workflow chamador
        type: string
        required: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    outputs:
      failed: ${{ steps.audit.outputs.failed }}
    steps:
      - id: audit
        name: Audit Record
        env:
          RESULTS: ${{ inputs.results }}
          PIPELINE: ${{ inputs.pipeline }}
          VERSION: ${{ inputs.version }}
        run: |
          jq -n --argjson needs "$RESULTS" \
            --arg pipeline "$PIPELINE" --arg version "$VERSION" \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" --arg event "$GITHUB_EVENT_NAME" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{pipeline: $pipeline, version: $version, repository: $repository, ref: $ref, sha: $sha,
              actor: $actor, event: $event, run_id: $run, attempt: $attempt,
              timestamp: (now | todate),
              jobs: ($needs | map_values(.result))}' > audit.json
          cat audit.json
          failed=$(jq -r '[.jobs[]] | any(. == "failure" or . == "cancelled")' audit.json)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "### $PIPELINE ${VERSION:+\`$VERSION\`}"
            echo "| etapa | resultado |"
            echo "|---|---|"
            jq -r '.jobs | to_entries[] | "| \(.key) | \(.value) |"' audit.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit.json

  error-analysis:
    name: Error Analysis
    needs: audit
    if: needs.audit.outputs.failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Failed Jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | @tsv')
          echo "## Analise de erros" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r id name steps; do
            [ -n "$id" ] || continue
            log=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>/dev/null || true)
            errors=$(grep -F '##[error]' <<<"$log" | sed -E 's/^[^ ]+ ##\[error\]//' | sort -u | head -20)
            {
              echo "### $name"
              echo "Step: **${steps:-?}**"
              echo '```'
              echo "${errors:-(sem mensagem ##[error]; veja o log do job)}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::$name"; echo "$errors"; echo "::endgroup::"
          done <<<"$jobs"
