# Camada da plataforma: testes, imagem versionada no registry e scan da imagem.
name: Pipeline Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      name:
        type: string
        required: true
      pipeline:
        description: pipeline.yml em JSON
        type: string
        required: true
      security:
        description: security-config.yml em JSON
        type: string
        required: true
      ref:
        type: string
        required: true
      skip-container-scan:
        type: boolean
        default: false
    outputs:
      image:
        description: Referencia da imagem publicada (registry/nome:versao)
        value: ${{ jobs.build.outputs.image }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.57.1

jobs:
  build:
    name: Build/Upload ${{ inputs.version }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Tests
        env:
          PIPELINE: ${{ inputs.pipeline }}
        run: |
          cmd=$(jq -r '.build.test // empty' <<<"$PIPELINE")
          if [ -z "$cmd" ]; then echo "pipeline.yml sem build.test: nenhum teste executado"; exit 0; fi
          bash -c "$cmd"

      - name: Image Reference
        id: image
        env:
          PIPELINE: ${{ inputs.pipeline }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "ref=ghcr.io/$owner/$NAME:$VERSION"
            echo "context=$(jq -r '.build.context // "."' <<<"$PIPELINE")"
            echo "dockerfile=$(jq -r '.build.dockerfile // "Dockerfile"' <<<"$PIPELINE")"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and Upload
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}

  container-scan:
    name: Container Security
    needs: build
    if: fromJSON(inputs.security).container.enabled && !inputs.skip-container-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false
      - name: Trivy (imagem publicada)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SEVERITY: ${{ fromJSON(inputs.security).container.failOn }}
          EXIT_CODE: ${{ fromJSON(inputs.security).container.gate && '1' || '0' }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            image --ignore-unfixed --severity "$SEVERITY" --ignorefile .trivyignore.yaml \
            --exit-code "$EXIT_CODE" "$IMAGE"
