# Plataforma / estagio: analises estaticas do codigo-fonte, em paralelo ao build.
# Cada scanner liga/desliga e quebra/registra por .github/configs/security-config.yml.
name: Stage Security

on:
  workflow_call:
    inputs:
      security:
        description: security-config.yml em JSON
        type: string
        required: true
      ref:
        type: string
        required: true
      skip:
        description: scanners pulados nesta execucao (JSON array; so snapshot/verify)
        type: string
        default: "[]"

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  secrets:
    name: Secrets
    if: fromJSON(inputs.security).secrets.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (historico completo)
        env:
          EXIT_CODE: ${{ fromJSON(inputs.security).secrets.gate && '1' || '0' }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner --exit-code "$EXIT_CODE"

  sast:
    name: SAST
    if: fromJSON(inputs.security).sast.enabled && !contains(fromJSON(inputs.skip), 'sast')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Semgrep
        env:
          GATE: ${{ fromJSON(inputs.security).sast.gate }}
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics off --severity ERROR \
            --sarif --output semgrep.sarif --error
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$GATE" = true ]; then
            echo "::error::SAST encontrou achados de severidade ERROR (detalhe no artefato sast)."
            exit "$rc"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-${{ github.run_attempt }}
          path: semgrep.sarif
          if-no-files-found: ignore

  sca:
    name: SCA
    if: fromJSON(inputs.security).sca.enabled && !contains(fromJSON(inputs.skip), 'sca')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trivy (dependencias)
        env:
          SEVERITY: ${{ fromJSON(inputs.security).sca.failOn }}
          EXIT_CODE: ${{ fromJSON(inputs.security).sca.gate && '1' || '0' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --scanners vuln --ignore-unfixed --severity "$SEVERITY" \
            --ignorefile .trivyignore.yaml --exit-code "$EXIT_CODE" .

  iac:
    name: IaC
    if: fromJSON(inputs.security).iac.enabled && !contains(fromJSON(inputs.skip), 'iac')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trivy (Dockerfile, manifestos)
        env:
          SEVERITY: ${{ fromJSON(inputs.security).iac.failOn }}
          EXIT_CODE: ${{ fromJSON(inputs.security).iac.gate && '1' || '0' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --skip-check-update --severity "$SEVERITY" --ignorefile .trivyignore.yaml \
            --exit-code "$EXIT_CODE" .
