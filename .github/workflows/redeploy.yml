# Camada da aplicacao: reimplanta uma versao ja publicada, sem rebuild.
# Passa pela mesma verificacao de attestation e pela mesma aprovacao de Environment.
name: Redeploy
run-name: ${{ inputs.command }} ${{ inputs.version }} em ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        description: Comando
        required: true
        options: [deploy, diff, destroy]
      version:
        type: string
        description: Versao do artefato (ex. 1.4.0 ou 1.5.0-12-SNAPSHOT)
      environment:
        type: environment
        description: Ambiente
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: read
  attestations: read
  actions: read
  id-token: write

jobs:
  redeploy:
    name: Redeploy
    uses: ./.github/workflows/stage-deploy.yml
    with:
      environments: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      command: ${{ inputs.command }}
