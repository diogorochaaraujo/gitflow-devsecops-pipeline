# Camada da aplicacao: o PR da branch de integracao para a main E o release.
name: Start Release
run-name: Start Release PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled`: trocar o tipo de release reavalia sem precisar de push
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: start-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write

jobs:
  start-release:
    name: Start Release
    uses: ./.github/workflows/pipeline-release-start.yml
