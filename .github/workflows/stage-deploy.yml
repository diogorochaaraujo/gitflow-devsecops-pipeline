# Plataforma / estagio: entrega de uma versao ja publicada, ambiente por ambiente.
# Usado pelo pipeline (snapshot, candidata, release) e pelo redeploy manual.
#
#   Prepare Deploy -> matriz (ambiente x artefato), na ordem pedida
#   <ENV>          -> verifica a attestation da imagem -> driver -> DAST
name: Stage Deploy

on:
  workflow_call:
    inputs:
      environments:
        description: Ambientes, em ordem, separados por virgula (ex. DSV,HMG)
        type: string
        required: true
      version:
        type: string
        default: ""
      command:
        description: deploy | diff | destroy
        type: string
        default: deploy
      ref:
        description: >-
          Commit de onde vem deploy-config, config/ e migracoes. Vazio = o commit
          que construiu a versao (label org.opencontainers.image.revision da imagem):
          um redeploy/rollback entrega a versao com a configuracao DELA.
        type: string
        default: ""
      platform-repository:
        type: string
        default: ""
      platform-ref:
        type: string
        default: ""

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

jobs:
  prepare-deploy:
    name: Prepare Deploy
    runs-on: ${{ vars.PIPELINE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.matrix.outputs.name }}
      dast: ${{ steps.matrix.outputs.dast }}
      provenance: ${{ steps.matrix.outputs.provenance }}
      signer: ${{ steps.matrix.outputs.signer }}
      source-ref: ${{ steps.source.outputs.ref }}
      platform-repository: ${{ steps.platform.outputs.repository }}
      platform-ref: ${{ steps.platform.outputs.ref }}
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      # o contexto `github` e do chamador: a plataforma descobre de qual commit
      # foi chamada (pinada, e o SHA do pino; local, o commit do proprio run)
      - id: platform
        name: Platform Version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_IN: ${{ inputs.platform-repository }}
          REF_IN: ${{ inputs.platform-ref }}
        run: |
          if [ -n "$REF_IN" ]; then
            repo=${REPO_IN:-$GITHUB_REPOSITORY}; sha=$REF_IN
          else
            w=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '[.referenced_workflows[] | select(.path | test("/\\.github/workflows/(platform|stage-deploy)\\.yml@"))][0] | "\(.path) \(.sha)"')
            repo=$(cut -d/ -f1,2 <<<"$w"); sha=${w##* }
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::versao da plataforma nao identificada ($w)"; exit 1; }
          { echo "repository=$repo"; echo "ref=$sha"; } >> "$GITHUB_OUTPUT"
          echo "Plataforma: $repo@$sha"
      - id: source
        name: Source Commit
        env:
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$REF" ] && [ -n "$VERSION" ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            name=$(gh api "repos/$GITHUB_REPOSITORY/contents/pipeline.yml" -H "Accept: application/vnd.github.raw" | yq '.app.name')
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name:$VERSION"
            REF=$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' \
              | jq -r 'if type == "object" and has("config") then .config.Labels["org.opencontainers.image.revision"]
                       else (to_entries[0].value.config.Labels["org.opencontainers.image.revision"]) end // empty')
            [ -n "$REF" ] || { echo "::error::$image sem label de revisao: informe o commit (ref) explicitamente."; exit 1; }
            echo "Versao $VERSION construida em $REF: deploy-config, config/ e migracoes desse commit."
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.platform.outputs.repository }}
          ref: ${{ steps.platform.outputs.ref }}
          path: .platform
          persist-credentials: false
      - name: Validate Input
        if: inputs.command == 'deploy' && inputs.version == ''
        run: echo "::error::deploy exige uma versao" && exit 1
      # antes de qualquer aprovacao: cada ambiente so aceita versoes do seu estagio
      - name: Deploy Policy
        if: inputs.command == 'deploy'
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: PIPELINE=$(yq -o=json -I=0 '.' pipeline.yml) .platform/scripts/check-deploy-policy.sh "$ENVIRONMENTS" "$VERSION"
      - id: matrix
        name: Render Matrix
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          VERSION: ${{ inputs.version }}
          PLATFORM_REPO: ${{ steps.platform.outputs.repository }}
        run: |
          matrix=$(.platform/scripts/render-deploy-matrix.sh --by-env .github/configs/deploy-config.yml "$ENVIRONMENTS")
          {
            echo "matrix=$matrix"
            echo "name=$(yq '.app.name' pipeline.yml)"
            echo "dast=$(yq -o=json -I=0 '.dast' .github/configs/security-config.yml)"
            echo "provenance=$(yq -o=json -I=0 '.provenance // {"attest": true, "verify": true}' .github/configs/security-config.yml)"
            echo "signer=$PLATFORM_REPO/.github/workflows/stage-build.yml"
          } >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"
          if [ "$GITHUB_WORKFLOW" = Redeploy ]; then
            echo "### Etapa E12 · redeploy \`${VERSION:-}\` em $ENVIRONMENTS ([mapa do processo]($GITHUB_SERVER_URL/$PLATFORM_REPO/blob/main/docs/00-mapa-do-processo.md))" >> "$GITHUB_STEP_SUMMARY"
          fi

  # UM job por ambiente = UMA aprovacao por ambiente. Dentro dele, os artefatos
  # entram em ordem fixa por driver: banco (flyway) antes das aplicacoes; e,
  # dentro de cada driver, por artifacts.<a>.order.
  deploy:
    name: ${{ matrix.env }} - ${{ inputs.version || inputs.command }}
    needs: prepare-deploy
    if: fromJSON(needs.prepare-deploy.outputs.matrix).include[0] != null
    runs-on: ${{ vars.PIPELINE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      packages: read
      attestations: read
      id-token: write
    strategy:
      matrix: ${{ fromJSON(needs.prepare-deploy.outputs.matrix) }}
      max-parallel: 1
    # aprovacao, segredos e historico de deploy ficam no GitHub Environment
    environment:
      name: ${{ matrix.env }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ matrix.env }}
      cancel-in-progress: false
    env:
      ARTIFACTS: ${{ toJSON(matrix.artifacts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare-deploy.outputs.platform-repository }}
          ref: ${{ needs.prepare-deploy.outputs.platform-ref }}
          path: .platform
          persist-credentials: false
      # configuracao por ambiente (config/) e migracoes (db/) vivem na aplicacao
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-deploy.outputs.source-ref }}
          path: .app
          persist-credentials: false

      - id: image
        name: Image Reference
        if: inputs.version != ''
        env:
          NAME: ${{ needs.prepare-deploy.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME:$VERSION" >> "$GITHUB_OUTPUT"

      # uma imagem por repositorio: verificada uma vez para todos os artefatos que a usam
      - id: verify
        name: Verify Artifact
        if: >-
          inputs.command == 'deploy' && (contains(matrix.drivers, 'kubernetes')
          || contains(matrix.drivers, 'gitops-pr') || contains(matrix.drivers, 'ecs'))
        uses: ./.platform/.github/actions/verify-artifact
        with:
          image: ${{ steps.image.outputs.tag }}
          signer-workflow: ${{ needs.prepare-deploy.outputs.signer }}
          verify-attestation: ${{ fromJSON(needs.prepare-deploy.outputs.provenance).verify }}
          token: ${{ github.token }}

      - name: Deploy (flyway)
        if: contains(matrix.drivers, 'flyway')
        uses: ./.platform/.github/actions/deploy-flyway
        with:
          command: ${{ inputs.command }}
          artifacts: ${{ env.ARTIFACTS }}
          env: ${{ matrix.env }}
          settings: ${{ toJSON(matrix.settings) }}
          app-dir: ${{ github.workspace }}/.app
          db-url: ${{ secrets.DB_URL }}
          db-user: ${{ secrets.DB_USER }}
          db-password: ${{ secrets.DB_PASSWORD }}

      - name: Deploy (ecs)
        if: contains(matrix.drivers, 'ecs')
        uses: ./.platform/.github/actions/deploy-ecs
        with:
          command: ${{ inputs.command }}
          artifacts: ${{ env.ARTIFACTS }}
          env: ${{ matrix.env }}
          version: ${{ inputs.version }}
          image: ${{ steps.verify.outputs.ref }}
          settings: ${{ toJSON(matrix.settings) }}
          role-arn: ${{ vars[format('AWS_ROLE_ARN_{0}', matrix.account)] }}
          region: ${{ vars.AWS_REGION }}

      - name: Deploy (kubernetes)
        if: contains(matrix.drivers, 'kubernetes')
        uses: ./.platform/.github/actions/deploy-kubernetes
        with:
          command: ${{ inputs.command }}
          artifacts: ${{ env.ARTIFACTS }}
          env: ${{ matrix.env }}
          version: ${{ inputs.version }}
          # kind carrega a imagem por tag; cluster real recebe o digest verificado
          image: ${{ (matrix.settings.kubernetes.cluster || 'kind') == 'kind' && steps.image.outputs.tag || steps.verify.outputs.ref }}
          settings: ${{ toJSON(matrix.settings) }}
          config-dir: ${{ github.workspace }}/.app/config
          registry-token: ${{ github.token }}
          kubeconfig: ${{ secrets.KUBECONFIG }}
          azure-client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.account)] }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.account)] }}

      - name: Deploy (gitops-pr)
        if: contains(matrix.drivers, 'gitops-pr')
        uses: ./.platform/.github/actions/deploy-gitops-pr
        with:
          command: ${{ inputs.command }}
          artifacts: ${{ env.ARTIFACTS }}
          env: ${{ matrix.env }}
          version: ${{ inputs.version }}
          image: ${{ steps.verify.outputs.ref }}
          settings: ${{ toJSON(matrix.settings) }}
          config-dir: ${{ github.workspace }}/.app/config
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      # ---- DAST contra cada servico recem-entregue (so onde o pipeline alcanca o servico) ----
      - name: Execute DAST
        if: >-
          inputs.command == 'deploy' && contains(matrix.drivers, 'kubernetes')
          && fromJSON(needs.prepare-deploy.outputs.dast).enabled
        env:
          GATE: ${{ fromJSON(needs.prepare-deploy.outputs.dast).gate }}
          ENV_NAME: ${{ matrix.env }}
          NAMESPACE: ${{ matrix.settings.kubernetes.namespace || '' }}
        run: |
          ns=${NAMESPACE:-$(tr '[:upper:]' '[:lower:]' <<<"$ENV_NAME")}
          mkdir -p zap && chmod 777 zap
          flags=(-I); [ "$GATE" = true ] && flags=()
          status=0
          while IFS=$'\t' read -r app port; do
            kubectl -n "$ns" port-forward "svc/$app" 18080:"$port" >/dev/null 2>&1 &
            pf=$!; sleep 3
            docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
              zap-baseline.py -t http://127.0.0.1:18080 -r "zap-$app.html" "${flags[@]}" || status=1
            kill "$pf" 2>/dev/null || true
          done < <(jq -r '.[] | select(.driver == "kubernetes" and .config.containerPort) | [.artifact, .config.containerPort] | @tsv' <<<"$ARTIFACTS")
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.command == 'deploy'
        with:
          name: dast-${{ matrix.env }}-${{ github.run_attempt }}
          path: zap/
          if-no-files-found: ignore
