name: deploy-gitops-pr
description: >-
  Driver gitops-pr. Grava o manifesto do ambiente na branch de estado de um
  repositorio (este ou outro) e abre PR; quem aplica no cluster e o agente GitOps.

inputs:
  command:
    default: deploy
  app:
    required: true
  env:
    required: true
  version:
    default: ""
  image:
    description: imagem@sha256 (o estado guarda o digest, nunca uma tag movel)
    default: ""
  config:
    required: true
  settings:
    required: true
  config-dir:
    description: pasta config/ da aplicacao (config/<artefato>/<env>.env)
    default: ""
  token:
    description: token com contents/pull-requests write no repositorio de estado
    required: true

outputs:
  pr:
    value: ${{ steps.deploy.outputs.pr }}

runs:
  using: composite
  steps:
    - id: target
      name: State Repository
      shell: bash
      env:
        SETTINGS: ${{ inputs.settings }}
      run: |
        repo=$(jq -r '.gitops.repository // ""' <<<"$SETTINGS")
        {
          echo "repo=${repo:-$GITHUB_REPOSITORY}"
          echo "branch=$(jq -r '.gitops.branch // "environments"' <<<"$SETTINGS")"
          echo "mode=$(jq -r '.gitops.mode // "pr"' <<<"$SETTINGS")"
          echo "path=$(jq -r '.gitops.path // empty' <<<"$SETTINGS")"
          echo "secret-store=$(jq -r '.kubernetes.secretStore // empty' <<<"$SETTINGS")"
        } >> "$GITHUB_OUTPUT"

    # clone separado: o script recria a branch de estado e limpa so esta pasta
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:  # zizmor: ignore[artipacked] -- o script faz push da branch de estado; o job nao sobe artefato
        repository: ${{ steps.target.outputs.repo }}
        token: ${{ inputs.token }}
        path: .state
        fetch-depth: 1

    - id: deploy
      name: Execute Deploy (gitops)
      shell: bash
      working-directory: .state
      env:
        APP: ${{ inputs.app }}
        ENV_NAME: ${{ inputs.env }}
        VERSION: ${{ inputs.version }}
        IMAGE: ${{ inputs.image }}
        CONFIG: ${{ inputs.config }}
        TARGET_REPO: ${{ steps.target.outputs.repo }}
        STATE_BRANCH: ${{ steps.target.outputs.branch }}
        MODE: ${{ steps.target.outputs.mode }}
        STATE_PATH: ${{ steps.target.outputs.path }}
        GH_TOKEN: ${{ inputs.token }}
        COMMAND: ${{ inputs.command }}
        CONFIG_DIR: ${{ inputs.config-dir }}
        SECRET_STORE: ${{ steps.target.outputs.secret-store }}
      run: |
        log="$RUNNER_TEMP/gitops-$ENV_NAME-$APP.log"
        "$GITHUB_ACTION_PATH/../../../scripts/deploy-gitops.sh" "$COMMAND" | tee "$log"
        echo "pr=$(grep -o 'https://[^ ]*/pull/[0-9]*' "$log" | tail -1 || true)" >> "$GITHUB_OUTPUT"
