name: Prepare
description: Le a configuracao da aplicacao (ja validada) e calcula a versao do artefato.

inputs:
  mode:
    description: snapshot | release
    required: true
  release-type:
    description: Major | Minor | Patch | auto
    default: Minor
  ref:
    description: commit versionado (auto le os commits ate ele)
    default: HEAD

outputs:
  version:
    value: ${{ steps.version.outputs.version }}
  name:
    value: ${{ steps.config.outputs.name }}
  pipeline:
    description: pipeline.yml em JSON
    value: ${{ steps.config.outputs.pipeline }}
  security:
    description: security-config.yml em JSON
    value: ${{ steps.config.outputs.security }}

runs:
  using: composite
  steps:
    - id: config
      name: Load Config
      shell: bash
      run: |
        {
          echo "pipeline=$(yq -o=json -I=0 '.' pipeline.yml)"
          echo "security=$(yq -o=json -I=0 '.' .github/configs/security-config.yml)"
          echo "name=$(yq '.app.name' pipeline.yml)"
        } >> "$GITHUB_OUTPUT"

    - id: version
      name: Versioning
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        REF: ${{ inputs.ref }}
        NAME: ${{ steps.config.outputs.name }}
      run: |
        version=$("$GITHUB_ACTION_PATH/../../../scripts/version.sh" "$MODE" "$RELEASE_TYPE" "$REF")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "### $NAME \`$version\`" >> "$GITHUB_STEP_SUMMARY"
