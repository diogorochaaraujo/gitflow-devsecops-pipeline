name: build-container
description: >-
  Constroi e publica a imagem com cache de camadas, SBOM e proveniencia, e
  registra a attestation assinada do build (prova de que a imagem saiu deste workflow).

inputs:
  image:
    description: Repositorio da imagem, sem tag (ghcr.io/<owner>/<nome>)
    required: true
  version:
    required: true
  context:
    required: true
  dockerfile:
    required: true
  revision:
    required: true
  cache-scope:
    required: true
  build-args:
    description: CHAVE=VALOR, um por linha (sem segredo: ficam gravados na imagem)
    default: ""
  attest:
    description: registra attestation (exige repo publico ou Enterprise Cloud)
    default: "true"
  token:
    required: true

outputs:
  ref:
    description: imagem:versao
    value: ${{ inputs.image }}:${{ inputs.version }}
  digest:
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ inputs.image }}:${{ inputs.version }}
        provenance: mode=max
        sbom: true
        build-args: ${{ inputs.build-args }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.revision }}
          org.opencontainers.image.version=${{ inputs.version }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

    - if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
