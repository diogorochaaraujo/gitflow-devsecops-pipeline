name: deploy-kubernetes
description: >-
  Driver kubernetes. Obtem acesso ao cluster do ambiente UMA vez (kind efemero,
  AKS por OIDC ou kubeconfig do Environment) e aplica, em ordem, o manifesto de
  cada artefato kubernetes do ambiente.

inputs:
  command:
    default: deploy
  artifacts:
    description: artefatos do ambiente (JSON [{artifact, driver, config}]); usa os de driver kubernetes
    required: true
  env:
    required: true
  version:
    default: ""
  image:
    description: Referencia aplicada no cluster (tag no kind, digest nos demais)
    default: ""
  settings:
    description: settings efetivos do ambiente (JSON)
    required: true
  config-dir:
    description: pasta config/ da aplicacao (config/<artefato>/<env>.env)
    default: ""
  registry-token:
    required: true
  kubeconfig:
    description: conteudo do kubeconfig (cluster=kubeconfig; segredo do Environment)
    default: ""
  azure-client-id:
    default: ""
  azure-tenant-id:
    default: ""
  azure-subscription-id:
    default: ""

runs:
  using: composite
  steps:
    - id: target
      name: Cluster Target
      shell: bash
      env:
        SETTINGS: ${{ inputs.settings }}
      run: |
        {
          echo "cluster=$(jq -r '.kubernetes.cluster // "kind"' <<<"$SETTINGS")"
          echo "namespace=$(jq -r '.kubernetes.namespace // empty' <<<"$SETTINGS")"
          echo "rg=$(jq -r '.kubernetes.resourceGroup // empty' <<<"$SETTINGS")"
          echo "name=$(jq -r '.kubernetes.clusterName // empty' <<<"$SETTINGS")"
          echo "secret-store=$(jq -r '.kubernetes.secretStore // empty' <<<"$SETTINGS")"
        } >> "$GITHUB_OUTPUT"

    # ---- kind: cluster efemero no runner (laboratorio, testes de integracao) ----
    - if: steps.target.outputs.cluster == 'kind'
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        cluster_name: lab

    - name: Load Image (kind)
      if: steps.target.outputs.cluster == 'kind' && inputs.command == 'deploy'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TOKEN: ${{ inputs.registry-token }}
      run: |
        echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
        docker pull --quiet "$IMAGE"
        kind load docker-image "$IMAGE" --name lab

    # ---- AKS: identidade federada por grupo de contas, sem segredo guardado ----
    - if: steps.target.outputs.cluster == 'aks'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: AKS Credentials
      if: steps.target.outputs.cluster == 'aks'
      shell: bash
      env:
        RG: ${{ steps.target.outputs.rg }}
        NAME: ${{ steps.target.outputs.name }}
      run: |
        az aks get-credentials --resource-group "$RG" --name "$NAME" --overwrite-existing
        command -v kubelogin >/dev/null && kubelogin convert-kubeconfig -l azurecli || true

    # ---- kubeconfig: segredo KUBECONFIG do Environment ----
    - name: Kubeconfig
      if: steps.target.outputs.cluster == 'kubeconfig'
      shell: bash
      env:
        KUBECONFIG_CONTENT: ${{ inputs.kubeconfig }}
        ENV_NAME: ${{ inputs.env }}
      run: |
        [ -n "$KUBECONFIG_CONTENT" ] || { echo "::error::Environment $ENV_NAME sem segredo KUBECONFIG."; exit 1; }
        umask 077; mkdir -p ~/.kube; printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config

    - name: Execute Deploy
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        ENV_NAME: ${{ inputs.env }}
        VERSION: ${{ inputs.version }}
        IMAGE: ${{ inputs.image }}
        NAMESPACE: ${{ steps.target.outputs.namespace }}
        EPHEMERAL: ${{ steps.target.outputs.cluster == 'kind' }}
        CONFIG_DIR: ${{ inputs.config-dir }}
        SECRET_STORE: ${{ steps.target.outputs.secret-store }}
        COMMAND: ${{ inputs.command }}
      run: |
        while IFS= read -r item; do
          APP=$(jq -r '.artifact' <<<"$item"); CONFIG=$(jq -c '.config' <<<"$item"); export APP CONFIG
          echo "::group::$APP"
          "$GITHUB_ACTION_PATH/../../../scripts/deploy-kubernetes.sh" "$COMMAND"
          echo "::endgroup::"
        done < <(jq -c '.[] | select(.driver == "kubernetes")' <<<"$ARTIFACTS")
