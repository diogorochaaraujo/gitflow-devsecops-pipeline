name: deploy-ecs
description: >-
  Driver ecs (referencia, nao exercitado pelo laboratorio). Assume UMA vez o
  papel de deploy do grupo de contas por OIDC e troca, em ordem, a imagem do
  servico de cada artefato ecs do ambiente.

inputs:
  command:
    default: deploy
  artifacts:
    description: artefatos do ambiente (JSON [{artifact, driver, config}]); usa os de driver ecs
    required: true
  env:
    required: true
  version:
    default: ""
  image:
    default: ""
  settings:
    required: true
  role-arn:
    description: valor de vars.AWS_ROLE_ARN_<GRUPO>
    required: true
  region:
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}

    - name: Execute Deploy (ecs)
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        ENV_NAME: ${{ inputs.env }}
        VERSION: ${{ inputs.version }}
        IMAGE: ${{ inputs.image }}
        SETTINGS: ${{ inputs.settings }}
        COMMAND: ${{ inputs.command }}
      run: |
        while IFS= read -r item; do
          APP=$(jq -r '.artifact' <<<"$item")
          # o cluster vem dos settings do ambiente; o artefato pode sobrescrever
          CONFIG=$(jq -c --argjson s "$SETTINGS" '{cluster: $s.ecs.cluster} + .config' <<<"$item")
          export APP CONFIG
          echo "::group::$APP"
          "$GITHUB_ACTION_PATH/../../../scripts/deploy-ecs.sh" "$COMMAND"
          echo "::endgroup::"
        done < <(jq -c '.[] | select(.driver == "ecs")' <<<"$ARTIFACTS")
