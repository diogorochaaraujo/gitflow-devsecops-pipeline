name: deploy-flyway
description: >-
  Driver flyway. Aplica, em ordem, as migracoes de cada artefato flyway do
  ambiente no banco do ambiente, ou as valida num Postgres descartavel quando o
  ambiente nao tem banco configurado. Roda antes de qualquer aplicacao.

inputs:
  command:
    default: deploy
  artifacts:
    description: artefatos do ambiente (JSON [{artifact, driver, config}]); usa os de driver flyway
    required: true
  env:
    required: true
  settings:
    required: true
  app-dir:
    description: checkout da aplicacao (caminho absoluto); migracoes em <app-dir>/<flyway.locations>
    required: true
  db-url:
    description: segredo DB_URL do Environment (jdbc:...)
    default: ""
  db-user:
    default: ""
  db-password:
    default: ""

runs:
  using: composite
  steps:
    - name: Execute Deploy (flyway)
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        ENV_NAME: ${{ inputs.env }}
        SETTINGS: ${{ inputs.settings }}
        APP_DIR: ${{ inputs.app-dir }}
        DB_URL: ${{ inputs.db-url }}
        DB_USER: ${{ inputs.db-user }}
        DB_PASSWORD: ${{ inputs.db-password }}
        COMMAND: ${{ inputs.command }}
        FLYWAY_IMAGE: flyway/flyway:13.10.0-alpine@sha256:c0c2592aa3ab9edf4dde3939d36df3d5f6ee27b8dcc51924ad8bca2470d24fdd
        POSTGRES_IMAGE: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      run: |
        while IFS= read -r item; do
          APP=$(jq -r '.artifact' <<<"$item"); CONFIG=$(jq -c '.config' <<<"$item")
          MIGRATIONS_DIR="$APP_DIR/$(jq -r '.flyway.locations // "db/migrations"' <<<"$CONFIG")"
          export APP CONFIG MIGRATIONS_DIR
          echo "::group::$APP"
          "$GITHUB_ACTION_PATH/../../../scripts/deploy-flyway.sh" "$COMMAND"
          echo "::endgroup::"
        done < <(jq -c '.[] | select(.driver == "flyway")' <<<"$ARTIFACTS")
