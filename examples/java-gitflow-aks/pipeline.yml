# Cenario: API Spring Boot, gitflow com label de release e chamado obrigatorio,
# deploy direto em AKS por identidade federada (sem segredo guardado no GitHub).
app:
  name: api-contratos

flow:
  model: gitflow
  integrationBranch: develop
  versioning: label
  changeRef: "[A-Z][A-Z0-9]+-[0-9]+"
  environments:
    snapshot: [DSV]
    candidate: [TST, HMG]
    release: [PRD, CTG]       # contingencia so depois de PRD terminar bem

build:
  stack: java
  java:
    version: "21"
    tool: maven
  container:
    context: .
    dockerfile: Dockerfile

security:
  skipOnSnapshot: [iac]
