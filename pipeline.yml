# Contrato da aplicacao com a plataforma: como construir e por qual fluxo entregar.
# Validado contra schemas/pipeline.schema.json no primeiro job de toda execucao.
# Referencia de campos: docs/04-config-as-code.md. Outros cenarios: examples/.
app:
  name: web-api

flow:
  model: gitflow              # gitflow | trunk
  integrationBranch: dsv      # gitflow: branch de integracao
  versioning: label           # label (Release-Major|Minor|Patch no PR) | conventional (commits)
  changeRef: "[A-Z][A-Z0-9]+-[0-9]+"  # PR de release cita o chamado (titulo, corpo ou branch)
  environments:
    snapshot: [DSV]           # gitflow: push na branch de integracao
    candidate: [HMG]          # gitflow: PR de release | trunk: merge na main, em ordem
    release: [PRD]            # depois da promocao da RC para X.Y.Z

build:
  stack: python               # node | python | java | container
  python:
    version: "3.12"
    workingDirectory: app
    test: python -m unittest discover -v
  container:
    context: app
    dockerfile: app/Dockerfile

security:
  skipOnSnapshot: []          # sast | sca | iac | container -- nunca vale na release
