# Manifesto renderizado por scripts/deploy-kind.sh (envsubst).
# Equivale ao "stack de tarefa de container" do driver ecs: um servico por ambiente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: prd
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/version: "0.1.0"
    environment: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-api
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-api
          image: ghcr.io/diogorochaaraujo/web-api@sha256:a58739c3064995a30123127f64d7376540b98264394431a9fcc059abc44bc711
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: APP_ENV
              value: PRD
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: {path: "/health", port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: "/health", port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: "512m", memory: "1024Mi"}
            limits: {cpu: "512m", memory: "1024Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web-api
  namespace: prd
spec:
  selector:
    app.kubernetes.io/name: web-api
  ports:
    - port: 8080
      targetPort: 8080
